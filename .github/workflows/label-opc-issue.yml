name: Label OPC registration issues

# 目的：确保「找人」页面能稳定拉到登记数据。
# 前台 people.html 依赖 `opc-profile` 标签抓取 Issue；
# Issue 表单虽然在模板里声明了 labels，但复用「空白 Issue」提交时不会带上，
# 所以在服务端再兜一层：识别到登记特征就补标签。

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add opc-profile label when registration markers found
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const isRegistration =
              title.includes('[OPC 登记]') ||
              body.includes('### 昵称') ||
              body.includes('### OPC 简介') ||
              body.includes('### 联系方式或站点');
            if (!isRegistration) return;

            const labels = new Set((issue.labels || []).map(l => l.name));
            if (labels.has('opc-profile')) {
              core.info('already labeled');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['opc-profile']
            });
            core.info(`labeled #${issue.number}`);
